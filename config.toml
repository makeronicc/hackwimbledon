baseURL = 'https://hackwimbledon.org/'
locale = 'en-GB'
metaDataFormat = "yaml"
title = 'HackWimbledon'
description = "A pop-up hackspace in Wimbledon: make, create, illuminate, and learn"
keywords = ["hackspace", "makerspace", "wimbledon", "hardware", "software", "maker", "electronics", "3d printing"]
copyright = "HackWimbledon"
defaultContentLanguage = "en"
enableRobotsTXT = true
pagination.pagerSize = 10
disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = 'github.com/gohugo-ananke/ananke/v2'

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  mediatype = "application/rss+xml"
  baseName = "feed"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = true



[params]
  background_color_class = "bg-black"
  featured_image = "/img/hwback2.jpg"
  site_logo = "/img/hw-2026-logo-new-512.png"
  show_reading_time = false
  body_classes= "dosis bg-near-white"
  post_content_classes = "dosis"
  recent_posts_number = 3
  mainSections = ["news"]
  description = "A pop-up hackspace in Wimbledon: make, create, illuminate, and learn"
  images = ["/img/hw-2026-logo-new-512.png"]

[menu]

  [[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

  [[menu.main]]
  name = "News"
  url = "/news/"
  weight = 2

  [[menu.main]]
  name = "Meetups"
  url = "/meetings/"
  weight = 3

  [[menu.main]]
  name = "People & Projects"
  url = "/peopleandprojects/"
  weight = 4

  [[menu.main]]
  name = "Events"
  url = "/events/"
  weight = 5


[params.ananke]
  custom_css = ["css/custom.css"]
  show_recent_posts = true

[params.ananke.social.follow]
networks = [
  "github",
  "mastodon",
  "bluesky",
  "discord"
]

[params.ananke.social.github]
username="makeronicc"

[params.ananke.social.mastodon]
username = "@hackwimbledon"
profilelink = "https://mastodon.org.uk/@hackwimbledon"

[params.ananke.social.bluesky]
username = "hackwimbledon.org"
profilelink = "https://mu.social/profile/hackwimbledon.org"

[params.ananke.social.networks.discord]
profile = "https://discord.gg/%s"
icon = "discord"

